name: Lint

on:
  push:
    branches: [development, production]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `changeset status --since` can diff against main.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check types
        # PUBLIC_IMAGE_URL and PUBLIC_SENTRY_DSN aren't secret (see .env.example)
        # but $env/static/public still needs them defined at sync/check time,
        # or svelte-check errors that the module has no such export.
        run: pnpm run check
        env:
          PUBLIC_IMAGE_URL: https://placeholder@localhost
          PUBLIC_SENTRY_DSN: https://placeholder@localhost/0

      - name: Require a changeset
        # Every PR must say how it bumps the version (patch/minor/major), or
        # add an empty changeset (`pnpm changeset --empty`) if it doesn't release.
        # Skipped for the bot's own "Version Packages" PR, which consumes them.
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/main
