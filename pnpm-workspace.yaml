overrides:
  # Force a single drizzle-orm instance: without this, better-auth's drizzle
  # adapter pulls in its own peer-resolved copy, and TS treats the two
  # `Column` classes (which have a protected member) as structurally distinct.
  drizzle-orm: ^0.40.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
  - workerd
